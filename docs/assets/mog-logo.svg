<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="mog — a moogle-style mascot carrying an HTTP/S packet">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e9e0fb"/>
    </linearGradient>
    <linearGradient id="pom" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe15a"/>
      <stop offset="1" stop-color="#f3c623"/>
    </linearGradient>
    <linearGradient id="wing" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cdb8f2"/>
      <stop offset="1" stop-color="#b096e6"/>
    </linearGradient>
    <linearGradient id="packet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a586e0"/>
      <stop offset="1" stop-color="#8a67d1"/>
    </linearGradient>
  </defs>

  <!-- Outline color used throughout -->
  <g fill="none" stroke="#5b4795" stroke-width="7" stroke-linejoin="round" stroke-linecap="round">

    <!-- Wings (behind the body) -->
    <g stroke-width="6">
      <path d="M176 250 C120 214 74 224 60 250 C92 250 96 276 128 274 C104 292 108 316 138 312 C150 300 176 298 186 292 Z" fill="url(#wing)"/>
      <path d="M336 250 C392 214 438 224 452 250 C420 250 416 276 384 274 C408 292 404 316 374 312 C362 300 336 298 326 292 Z" fill="url(#wing)"/>
    </g>

    <!-- Antenna + yellow pom-pom -->
    <path d="M256 150 C250 120 250 104 256 92" stroke-width="8"/>
    <circle cx="256" cy="74" r="30" fill="url(#pom)"/>

    <!-- Ear tufts -->
    <path d="M188 176 C176 138 196 128 214 150 C210 164 206 176 206 184 Z" fill="url(#body)"/>
    <path d="M324 176 C336 138 316 128 298 150 C302 164 306 176 306 184 Z" fill="url(#body)"/>

    <!-- Head / body -->
    <path d="M256 150
             C330 150 388 200 388 268
             C388 344 330 392 256 392
             C182 392 124 344 124 268
             C124 200 182 150 256 150 Z" fill="url(#body)"/>

    <!-- Face: thin cartoon eyes, blush, small mouth -->
    <g stroke="none" fill="#1c1230">
      <path d="M214 238 C214 224 226 224 226 238 C226 252 214 252 214 238 Z"/>
      <path d="M286 238 C286 224 298 224 298 238 C298 252 286 252 286 238 Z"/>
    </g>
    <g fill="#e7b7d8" stroke="none" opacity="0.85">
      <ellipse cx="200" cy="262" rx="16" ry="10"/>
      <ellipse cx="312" cy="262" rx="16" ry="10"/>
    </g>
    <path d="M244 268 C250 276 262 276 268 268" stroke-width="6"/>

    <!-- Arms cradling the packet -->
    <path d="M170 300 C150 320 152 348 176 356" stroke-width="7" fill="url(#body)"/>
    <path d="M342 300 C362 320 360 348 336 356" stroke-width="7" fill="url(#body)"/>

    <!-- HTTP/S packet held at the belly -->
    <rect x="188" y="300" width="136" height="92" rx="14" fill="url(#packet)"/>
    <path d="M188 314 L256 352 L324 314" stroke="#efe8ff" stroke-width="6"/>
    <!-- padlock (the "S") -->
    <g transform="translate(238,326)" stroke="#efe8ff" stroke-width="5">
      <rect x="0" y="12" width="36" height="26" rx="5" fill="#efe8ff" stroke="none"/>
      <path d="M7 12 V6 C7 -4 29 -4 29 6 V12" fill="none"/>
    </g>
    <text x="256" y="384" text-anchor="middle" font-family="-apple-system, Helvetica, Arial, sans-serif"
          font-size="20" font-weight="700" fill="#efe8ff" stroke="none">HTTP/S</text>

    <!-- Little feet -->
    <path d="M214 392 C210 408 226 410 230 396" stroke-width="7" fill="url(#body)"/>
    <path d="M298 392 C302 408 286 410 282 396" stroke-width="7" fill="url(#body)"/>
  </g>
</svg>

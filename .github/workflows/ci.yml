# Generated by cppboot (default; --no-github-actions to skip)
# Matrix CI: Ubuntu, macOS, Windows — Debug + Release builds, tests, benchmarks.
# Action pins: latest stable majors (checkout/upload-artifact v7; get-cmake latest CMake/Ninja).
name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            enforce_backends: "embedded,curl"
          - os: macos-latest
            enforce_backends: "embedded,native,curl"
          - os: windows-latest
            enforce_backends: "embedded,winhttp"
    env:
      APP_NAME: mog
      # Fail CI if a backend expected on this OS is not actually available
      # (turns the *IfAvailable conformance skips into hard failures).
      MOG_CI_ENFORCE_BACKENDS: ${{ matrix.enforce_backends }}

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install latest CMake and Ninja
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: latest
          ninjaVersion: latest

      - name: Enable MSVC developer command prompt
        if: runner.os == 'Windows'
        uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: x64

      - name: Configure Debug
        run: >
          cmake -S . -B build/debug -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Build Debug
        run: cmake --build build/debug --parallel

      - name: Test Debug
        run: ctest --test-dir build/debug --output-on-failure --parallel

      - name: Configure Release
        run: >
          cmake -S . -B build/release -G Ninja
          -DCMAKE_BUILD_TYPE=Release

      - name: Build Release
        run: cmake --build build/release --parallel

      - name: Test Release
        run: ctest --test-dir build/release --output-on-failure --parallel

      - name: Benchmark (Release)
        run: |
          set -euo pipefail
          # Collect Google Benchmark binaries (none is OK).
          bins="$(find build/release -type f \( -name '*bench' -o -name '*_bench' -o -name '*bench.exe' -o -name '*_bench.exe' \) 2>/dev/null | head -n 20 || true)"
          if [ -z "${bins}" ]; then
            echo "No benchmark binaries found; skipping."
            exit 0
          fi
          while IFS= read -r bin; do
            [ -z "${bin}" ] && continue
            # Skip non-executables if any slip through on Windows.
            if [ ! -x "${bin}" ] && [[ "${bin}" != *.exe ]]; then
              continue
            fi
            echo "Running ${bin}"
            "${bin}" --benchmark_min_time=0.01s
          done <<< "${bins}"

      # Archives: <app>-<os>-<arch>-<debug|release>-<version>.zip
      - name: Package Debug artifacts
        id: pkg_debug
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, re, shutil, subprocess
          from pathlib import Path

          app = os.environ["APP_NAME"]
          os_name = {"Linux": "linux", "macOS": "macos", "Windows": "windows"}.get(
              os.environ.get("RUNNER_OS", ""), os.environ.get("RUNNER_OS", "unknown").lower()
          )
          arch = {"X64": "x86_64", "ARM64": "arm64", "X86": "x86"}.get(
              os.environ.get("RUNNER_ARCH", ""), os.environ.get("RUNNER_ARCH", "unknown").lower()
          )
          config = "debug"
          bin_dir = Path("build") / config / "bin"
          version = "0.1.0"
          for candidate in (bin_dir / app, bin_dir / f"{app}.exe"):
              if candidate.is_file():
                  try:
                      out = subprocess.check_output([str(candidate), "--version"], text=True, stderr=subprocess.STDOUT)
                      m = re.search(r"\d+\.\d+\.\d+", out)
                      if m:
                          version = m.group(0)
                  except Exception:
                      pass
                  break
          stem = f"{app}-{os_name}-{arch}-{config}-{version}"
          staging = Path("dist") / stem
          if staging.exists():
              shutil.rmtree(staging)
          staging.mkdir(parents=True)
          if bin_dir.is_dir():
              for p in bin_dir.iterdir():
                  dest = staging / p.name
                  if p.is_file():
                      shutil.copy2(p, dest)
                  elif p.is_dir():
                      shutil.copytree(p, dest)
          archive = shutil.make_archive(str(Path("dist") / stem), "zip", root_dir="dist", base_dir=stem)
          print(f"Created {archive}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"artifact_name={stem}\n")
              fh.write(f"artifact_path={archive}\n")
          PY

      - name: Upload Debug artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.pkg_debug.outputs.artifact_name }}
          path: ${{ steps.pkg_debug.outputs.artifact_path }}
          if-no-files-found: error
          retention-days: 14

      - name: Package Release artifacts
        id: pkg_release
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, re, shutil, subprocess
          from pathlib import Path

          app = os.environ["APP_NAME"]
          os_name = {"Linux": "linux", "macOS": "macos", "Windows": "windows"}.get(
              os.environ.get("RUNNER_OS", ""), os.environ.get("RUNNER_OS", "unknown").lower()
          )
          arch = {"X64": "x86_64", "ARM64": "arm64", "X86": "x86"}.get(
              os.environ.get("RUNNER_ARCH", ""), os.environ.get("RUNNER_ARCH", "unknown").lower()
          )
          config = "release"
          bin_dir = Path("build") / config / "bin"
          version = "0.1.0"
          for candidate in (bin_dir / app, bin_dir / f"{app}.exe"):
              if candidate.is_file():
                  try:
                      out = subprocess.check_output([str(candidate), "--version"], text=True, stderr=subprocess.STDOUT)
                      m = re.search(r"\d+\.\d+\.\d+", out)
                      if m:
                          version = m.group(0)
                  except Exception:
                      pass
                  break
          stem = f"{app}-{os_name}-{arch}-{config}-{version}"
          staging = Path("dist") / stem
          if staging.exists():
              shutil.rmtree(staging)
          staging.mkdir(parents=True)
          if bin_dir.is_dir():
              for p in bin_dir.iterdir():
                  dest = staging / p.name
                  if p.is_file():
                      shutil.copy2(p, dest)
                  elif p.is_dir():
                      shutil.copytree(p, dest)
          archive = shutil.make_archive(str(Path("dist") / stem), "zip", root_dir="dist", base_dir=stem)
          print(f"Created {archive}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"artifact_name={stem}\n")
              fh.write(f"artifact_path={archive}\n")
          PY

      - name: Upload Release artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.pkg_release.outputs.artifact_name }}
          path: ${{ steps.pkg_release.outputs.artifact_path }}
          if-no-files-found: error
          retention-days: 14

  web:
    name: web (Emscripten/browser)
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install latest CMake and Ninja
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: latest
          ninjaVersion: latest

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest

      - name: Configure Debug
        run: >
          emcmake cmake -S . -B build/web-debug -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DMOG_BUILD_TESTS=ON
          -DMOG_WITH_CLI11=OFF
          -DMOG_WITH_JSON=OFF
          -DMOG_WITH_SPDLOG=OFF

      - name: Build Debug
        run: cmake --build build/web-debug --parallel

      - name: Test Debug in headless Chrome
        run: >
          emrun --browser=google-chrome
          --browser_args="--headless=new --no-sandbox --disable-gpu"
          --kill_exit --timeout 120
          build/web-debug/bin/mog_web_test.html

      - name: Configure Release
        run: >
          emcmake cmake -S . -B build/web-release -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DMOG_BUILD_TESTS=ON
          -DMOG_WITH_CLI11=OFF
          -DMOG_WITH_JSON=OFF
          -DMOG_WITH_SPDLOG=OFF

      - name: Build Release
        run: cmake --build build/web-release --parallel

      - name: Test Release in headless Chrome
        run: >
          emrun --browser=google-chrome
          --browser_args="--headless=new --no-sandbox --disable-gpu"
          --kill_exit --timeout 120
          build/web-release/bin/mog_web_test.html

      - name: Package web consumer library
        id: package
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION | sed 's/^v//;s/^V//;s/#.*//')"
          stem="mog-web-wasm32-release-${version}"
          prefix="${PWD}/dist/${stem}"
          cmake --install build/web-release --prefix "${prefix}"
          emcc --version > dist/emscripten-version.txt
          sed -n '1p' dist/emscripten-version.txt > "${prefix}/EMSCRIPTEN_VERSION"
          cp LICENSE "${prefix}/LICENSE"
          (cd dist && zip -r "${stem}.zip" "${stem}" >/dev/null)
          echo "artifact_name=${stem}" >> "${GITHUB_OUTPUT}"
          echo "artifact_path=dist/${stem}.zip" >> "${GITHUB_OUTPUT}"

      - name: Upload web package
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.package.outputs.artifact_name }}
          path: ${{ steps.package.outputs.artifact_path }}
          if-no-files-found: error
          retention-days: 14

  android:
    name: Android (Prefab AAR / emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build Debug AAR and consumer APK
        run: |
          ./android/gradlew -p android --no-daemon :mog:assembleDebug
          ./android/gradlew -p android --no-daemon :test-app:assembleDebug

      - name: Build Release AAR and consumer APK
        run: |
          ./android/gradlew -p android --no-daemon :mog:assembleRelease
          ./android/gradlew -p android --no-daemon :test-app:assembleRelease

      - name: Verify Release AAR
        run: |
          set -euo pipefail
          aar=android/mog/build/outputs/aar/mog-release.aar
          test -f "${aar}"
          unzip -Z1 "${aar}" > aar-entries.txt
          for abi in armeabi-v7a arm64-v8a x86_64; do
            grep -qx "prefab/modules/mog/libs/android.${abi}/libmog.so" aar-entries.txt
            grep -qx "jni/${abi}/libmog.so" aar-entries.txt
          done
          grep -qx "prefab/modules/mog/include/mog/version.hpp" aar-entries.txt
          version="$(tr -d '[:space:]' < VERSION | sed 's/^v//;s/^V//;s/#.*//')"
          unzip -p "${aar}" prefab/prefab.json | grep -q "\"version\"[[:space:]]*:[[:space:]]*\"${version}\""

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Release package tests on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: bash scripts/run_android_tests.sh

      - name: Package Android Release AAR
        id: package
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION | sed 's/^v//;s/^V//;s/#.*//')"
          stem="mog-android-release-${version}"
          mkdir -p dist
          cp android/mog/build/outputs/aar/mog-release.aar "dist/${stem}.aar"
          echo "artifact_name=${stem}" >> "${GITHUB_OUTPUT}"
          echo "artifact_path=dist/${stem}.aar" >> "${GITHUB_OUTPUT}"

      - name: Upload Android package
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.package.outputs.artifact_name }}
          path: ${{ steps.package.outputs.artifact_path }}
          if-no-files-found: error
          retention-days: 14

  ios:
    name: iOS (XCFramework / simulator)
    runs-on: macos-latest
    timeout-minutes: 35
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install latest CMake and Ninja
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: latest
          ninjaVersion: latest

      - name: Build Debug XCFramework and consumer apps
        run: |
          scripts/build_ios_xcframework.sh Debug build/ios/debug
          scripts/build_ios_test_apps.sh \
            build/ios/debug/mog.xcframework Debug build/ios/consumer-debug

      - name: Build Release XCFramework and consumer apps
        run: |
          scripts/build_ios_xcframework.sh Release build/ios/release
          scripts/build_ios_test_apps.sh \
            build/ios/release/mog.xcframework Release build/ios/consumer-release

      - name: Run Release package tests in iOS Simulator
        env:
          BUILD_DIR: build/ios/consumer-release/iphonesimulator
        run: scripts/run_ios_tests.sh

      - name: Stage iOS package metadata
        id: ios_package
        run: |
          version="$(tr -d '[:space:]' < VERSION | sed 's/^v//;s/^V//;s/#.*//')"
          echo "artifact_name=mog-ios-xcframework-release-${version}" >> "${GITHUB_OUTPUT}"
          echo "artifact_path=build/ios/release/mog-ios-xcframework-release-${version}.zip" >> "${GITHUB_OUTPUT}"

      - name: Upload iOS package
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.ios_package.outputs.artifact_name }}
          path: ${{ steps.ios_package.outputs.artifact_path }}
          if-no-files-found: error
          retention-days: 14

  # Fully static (musl) Linux binary for scratch / minimal images. Proves the
  # "one static binary, encrypted HTTP, nothing else on disk" story end to end.
  linux-static:
    name: linux-static (alpine/musl, scratch)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build static musl binary + scratch image
        run: docker build -f docker/Dockerfile.linux-static -t mog-static .

      - name: Verify fully static and extract the binary
        run: |
          set -euo pipefail
          cid="$(docker create mog-static --version)"
          docker cp "${cid}:/mog" mog-linux-x86_64-static
          docker rm "${cid}" >/dev/null
          file mog-linux-x86_64-static
          file mog-linux-x86_64-static | grep -q "statically linked"

      - name: HTTPS from scratch using the bundled CA bundle (no CA file on disk)
        run: |
          set -uo pipefail
          # -f => exit 0 only on a successful (2xx/3xx) HTTPS exchange; the TLS
          # handshake here verifies against the compiled-in Mozilla CA bundle with
          # no CA file on the scratch filesystem. Retry to absorb network blips.
          for attempt in 1 2 3; do
            if docker run --rm mog-static get https://example.com -f -s -o /dev/null; then
              echo "scratch HTTPS OK"; exit 0
            fi
            echo "attempt ${attempt} failed; retrying"; sleep 3
          done
          echo "scratch HTTPS check failed"; exit 1

      - name: Upload static binary
        uses: actions/upload-artifact@v7
        with:
          name: mog-linux-x86_64-static
          path: mog-linux-x86_64-static
          if-no-files-found: error
          retention-days: 14

# Generated by cppboot (default; --no-github-actions to skip)
# Create GitHub Releases from v* tags or workflow_dispatch.
# Version source of truth is the root VERSION file (must match tag / input).
# Attaches <app>-<os>-<arch>-release-<version>.zip and auto-generated notes.
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Semver without leading v (must match VERSION file; leave empty to use VERSION)"
        required: false
        type: string
        default: ""
      prerelease:
        description: "Mark as prerelease"
        required: false
        type: boolean
        default: false
      dry_run:
        description: "Build and draft only (do not publish release)"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      dry_run: ${{ steps.meta.outputs.dry_run }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve tag and version (synced with VERSION file)
        id: meta
        env:
          INPUT_VERSION: ${{ github.event.inputs.version || '' }}
          INPUT_PRERELEASE: ${{ github.event.inputs.prerelease || 'false' }}
          INPUT_DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: |
          set -euo pipefail
          if [ ! -f VERSION ]; then
            echo "Missing VERSION file at repo root (single source of truth)."
            exit 1
          fi
          FILE_VERSION="$(tr -d '[:space:]' < VERSION | sed 's/^v//;s/^V//;s/#.*//')"
          if ! [[ "${FILE_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-].*)?$ ]]; then
            echo "Invalid VERSION file contents: '${FILE_VERSION}' (expected semver like 1.0.0)"
            exit 1
          fi

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ -z "${INPUT_VERSION}" ]; then
              VERSION="${FILE_VERSION}"
            else
              VERSION="${INPUT_VERSION#v}"
              VERSION="${VERSION#V}"
            fi
            if [ "${VERSION}" != "${FILE_VERSION}" ]; then
              echo "Release version '${VERSION}' does not match VERSION file '${FILE_VERSION}'."
              echo "Bump the VERSION file (and only that file), commit, then re-run the release."
              exit 1
            fi
            TAG="v${VERSION}"
            PRERELEASE="${INPUT_PRERELEASE}"
            DRY_RUN="${INPUT_DRY_RUN}"
            # Do not push tags here — that would re-trigger this workflow.
            # softprops/action-gh-release creates the tag on publish when missing.
          else
            TAG="${{ github.ref_name }}"
            VERSION="${TAG#v}"
            VERSION="${VERSION#V}"
            PRERELEASE=false
            DRY_RUN=false
            if [[ "${TAG}" == *-* ]] || [[ "${TAG}" == *alpha* ]] || [[ "${TAG}" == *beta* ]] || [[ "${TAG}" == *rc* ]]; then
              PRERELEASE=true
            fi
            if [ "${VERSION}" != "${FILE_VERSION}" ]; then
              echo "Tag version '${VERSION}' does not match VERSION file '${FILE_VERSION}'."
              echo "Bump VERSION, commit, then tag v${FILE_VERSION} (or retag after fixing VERSION)."
              exit 1
            fi
          fi
          {
            echo "version=${VERSION}"
            echo "tag=${TAG}"
            echo "prerelease=${PRERELEASE}"
            echo "dry_run=${DRY_RUN}"
          } >> "${{ github.output }}"
          echo "Resolved release ${TAG} (version=${VERSION}, file=${FILE_VERSION}, prerelease=${PRERELEASE}, dry_run=${DRY_RUN})"

  build:
    name: build-${{ matrix.os }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    env:
      APP_NAME: mog
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install latest CMake and Ninja
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: latest
          ninjaVersion: latest

      - name: Enable MSVC developer command prompt
        if: runner.os == 'Windows'
        uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: x64

      - name: Configure Release
        run: >
          cmake -S . -B build/release -G Ninja
          -DCMAKE_BUILD_TYPE=Release

      - name: Build Release
        run: cmake --build build/release --parallel

      - name: Test Release
        run: ctest --test-dir build/release --output-on-failure --parallel

      - name: Verify binary version matches release
        run: |
          set -euo pipefail
          bin="build/release/bin/${APP_NAME}"
          if [ ! -x "${bin}" ] && [ -f "${bin}.exe" ]; then
            bin="${bin}.exe"
          fi
          if [ ! -f "${bin}" ]; then
            echo "Missing app binary at build/release/bin/${APP_NAME}"
            exit 1
          fi
          out="$("${bin}" --version 2>&1 || true)"
          echo "Binary --version output: ${out}"
          if ! echo "${out}" | grep -Eq "(^|[[:space:]])${RELEASE_VERSION}([[:space:]]|$)"; then
            echo "Version mismatch: expected ${RELEASE_VERSION} from VERSION/tag, got: ${out}"
            echo "Edit the root VERSION file only, reconfigure/rebuild, then release."
            exit 1
          fi
          file_ver="$(tr -d '[:space:]' < VERSION | sed 's/^v//;s/^V//;s/#.*//')"
          if [ "${file_ver}" != "${RELEASE_VERSION}" ]; then
            echo "VERSION file (${file_ver}) drifted from release version (${RELEASE_VERSION})."
            exit 1
          fi

      - name: Verify shared library (soname / exports)
        run: |
          set -euo pipefail
          major="${RELEASE_VERSION%%.*}"
          # Tool output is written to files, then grepped, so `grep -q` closing a
          # pipe early cannot make a tool die on SIGPIPE (LLVM tools treat a broken
          # pipe as a hard error, which `pipefail` would surface as a failure).
          case "${RUNNER_OS}" in
            Linux)
              real=$(ls build/release/lib/libmog_c.so.* 2>/dev/null \
                     | grep -E "\.so\.[0-9]+\.[0-9]+\.[0-9]+$" | head -1)
              [ -n "${real}" ] || { echo "no versioned libmog_c.so"; exit 1; }
              echo "shared: ${real}"
              readelf -d "${real}" > dyn.txt
              grep SONAME dyn.txt || true
              grep -q "libmog_c.so.${major}" dyn.txt \
                || { echo "SONAME is not libmog_c.so.${major}"; exit 1; }
              nm -D "${real}" > syms.txt
              grep -qw mog_server_new syms.txt || { echo "mog_server_new not exported"; exit 1; }
              grep -qw mog_get syms.txt || { echo "mog_get not exported"; exit 1; }
              ;;
            macOS)
              real=$(ls build/release/lib/libmog_c.*.dylib 2>/dev/null \
                     | grep -E "libmog_c\.[0-9]+\.[0-9]+\.[0-9]+\.dylib$" | head -1)
              [ -n "${real}" ] || { echo "no versioned libmog_c dylib"; exit 1; }
              echo "shared: ${real}"
              otool -D "${real}" > install_name.txt
              cat install_name.txt
              grep -q "@rpath/libmog_c.${major}.dylib" install_name.txt \
                || { echo "install_name is not @rpath/libmog_c.${major}.dylib"; exit 1; }
              # Match defined external symbols (T). Avoid `nm -U`, whose meaning
              # differs across nm variants (defined-only vs undefined-only).
              nm -g "${real}" > syms.txt
              grep -qE "T _mog_server_new$" syms.txt || { echo "mog_server_new not exported"; exit 1; }
              grep -qE "T _mog_get$" syms.txt || { echo "mog_get not exported"; exit 1; }
              ;;
            Windows)
              dll="build/release/bin/mog_c.dll"
              [ -f "${dll}" ] || { echo "no mog_c.dll"; exit 1; }
              dumpbin -exports "${dll}" > exports.txt
              grep -q "mog_server_new" exports.txt || { echo "mog_server_new not exported"; exit 1; }
              grep -q "mog_get" exports.txt || { echo "mog_get not exported"; exit 1; }
              test -f build/release/lib/mog_c.lib || { echo "missing import library mog_c.lib"; exit 1; }
              ;;
          esac
          echo "shared library verification passed"

      - name: Package Release zip
        id: pkg
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, shutil, stat, zipfile
          from pathlib import Path

          app = os.environ["APP_NAME"]
          version = os.environ["RELEASE_VERSION"]
          runner = os.environ.get("RUNNER_OS", "")
          os_name = {"Linux": "linux", "macOS": "macos", "Windows": "windows"}.get(
              runner, runner.lower()
          )
          arch = {"X64": "x86_64", "ARM64": "arm64", "X86": "x86"}.get(
              os.environ.get("RUNNER_ARCH", ""), os.environ.get("RUNNER_ARCH", "unknown").lower()
          )
          is_windows = runner == "Windows"

          build = Path("build") / "release"
          bin_dir = build / "bin"
          lib_dir = build / "lib"
          stem = f"{app}-{os_name}-{arch}-release-{version}"
          staging = Path("dist") / stem
          if staging.exists():
              shutil.rmtree(staging)
          (staging / "lib").mkdir(parents=True)
          (staging / "include" / "mog").mkdir(parents=True)

          # CLI executable at the archive root.
          exe = bin_dir / (app + (".exe" if is_windows else ""))
          if not exe.is_file():
              raise SystemExit(f"missing CLI binary {exe}")
          shutil.copy2(exe, staging / exe.name)

          # Shared C library (libmog_c) plus link material.
          if is_windows:
              dll = bin_dir / "mog_c.dll"
              if not dll.is_file():
                  raise SystemExit(f"missing {dll}")
              shutil.copy2(dll, staging / dll.name)          # next to the exe
              imp = lib_dir / "mog_c.lib"
              if imp.is_file():
                  shutil.copy2(imp, staging / "lib" / imp.name)  # import library
          else:
              shared = [p for p in lib_dir.iterdir()
                        if p.name.startswith("libmog_c") and not p.name.endswith(".a")]
              if not shared:
                  raise SystemExit(f"no libmog_c shared library in {lib_dir}")
              for p in shared:
                  dest = staging / "lib" / p.name
                  if p.is_symlink():
                      os.symlink(os.readlink(p), dest)       # preserve soname chain
                  else:
                      shutil.copy2(p, dest)

          # Public header + license.
          shutil.copy2(Path("include") / "mog" / "mog_c.h", staging / "include" / "mog" / "mog_c.h")
          if Path("LICENSE").is_file():
              shutil.copy2("LICENSE", staging / "LICENSE")

          # Zip, preserving symlinks (soname chain) and the executable bit.
          archive = Path("dist") / f"{stem}.zip"
          if archive.exists():
              archive.unlink()
          with zipfile.ZipFile(archive, "w", zipfile.ZIP_DEFLATED) as zf:
              for path in sorted(staging.rglob("*")):
                  arcname = str(path.relative_to(Path("dist")))
                  if path.is_symlink():
                      zi = zipfile.ZipInfo(arcname)
                      zi.create_system = 3  # Unix
                      zi.external_attr = (stat.S_IFLNK | 0o777) << 16
                      zf.writestr(zi, os.readlink(path))
                  elif path.is_dir():
                      continue
                  else:
                      zi = zipfile.ZipInfo(arcname)
                      zi.create_system = 3
                      zi.external_attr = (path.stat().st_mode & 0xFFFF) << 16
                      zi.compress_type = zipfile.ZIP_DEFLATED
                      with open(path, "rb") as fh:
                          zf.writestr(zi, fh.read())
          print(f"Created {archive}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"artifact_name={stem}\n")
              fh.write(f"artifact_path={archive}\n")
          PY

      - name: Upload Release zip (workflow artifact)
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.pkg.outputs.artifact_name }}
          path: ${{ steps.pkg.outputs.artifact_path }}
          if-no-files-found: error
          retention-days: 14

  build-web:
    name: build-web (Emscripten/browser)
    needs: prepare
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install latest CMake and Ninja
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: latest
          ninjaVersion: latest

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest

      - name: Configure Release
        run: >
          emcmake cmake -S . -B build/web-release -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DMOG_BUILD_TESTS=ON
          -DMOG_WITH_CLI11=OFF
          -DMOG_WITH_JSON=OFF
          -DMOG_WITH_SPDLOG=OFF

      - name: Build Release
        run: cmake --build build/web-release --parallel

      - name: Test Release in headless Chrome
        run: >
          emrun --browser=google-chrome
          --browser_args="--headless=new --no-sandbox --disable-gpu"
          --kill_exit --timeout 120
          build/web-release/bin/mog_web_test.html

      - name: Package web consumer library
        id: pkg
        run: |
          set -euo pipefail
          stem="mog-web-wasm32-release-${RELEASE_VERSION}"
          prefix="${PWD}/dist/${stem}"
          cmake --install build/web-release --prefix "${prefix}"
          emcc --version > dist/emscripten-version.txt
          sed -n '1p' dist/emscripten-version.txt > "${prefix}/EMSCRIPTEN_VERSION"
          cp LICENSE "${prefix}/LICENSE"
          (cd dist && zip -r "${stem}.zip" "${stem}" >/dev/null)
          echo "artifact_name=${stem}" >> "${GITHUB_OUTPUT}"
          echo "artifact_path=dist/${stem}.zip" >> "${GITHUB_OUTPUT}"

      - name: Upload web Release zip
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.pkg.outputs.artifact_name }}
          path: ${{ steps.pkg.outputs.artifact_path }}
          if-no-files-found: error
          retention-days: 14

  build-linux-static:
    name: build-linux-static (alpine/musl)
    needs: prepare
    runs-on: ubuntu-latest
    env:
      APP_NAME: mog
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build fully static musl binary
        run: docker build -f docker/Dockerfile.linux-static -t mog-static .

      - name: Extract, verify static + version
        run: |
          set -euo pipefail
          cid="$(docker create mog-static --version)"
          docker cp "${cid}:/mog" mog
          docker rm "${cid}" >/dev/null
          file mog
          file mog | grep -q "statically linked"
          out="$(docker run --rm mog-static --version 2>&1 || true)"
          echo "Binary --version output: ${out}"
          if ! echo "${out}" | grep -Eq "(^|[[:space:]])${RELEASE_VERSION}([[:space:]]|$)"; then
            echo "Static binary version mismatch: expected ${RELEASE_VERSION}, got: ${out}"
            exit 1
          fi

      - name: Package static zip
        id: pkg
        run: |
          set -euo pipefail
          stem="${APP_NAME}-linux-x86_64-static-${RELEASE_VERSION}"
          mkdir -p "dist/${stem}"
          cp mog "dist/${stem}/mog"
          (cd dist && zip -r "${stem}.zip" "${stem}" >/dev/null)
          echo "artifact_name=${stem}" >> "${GITHUB_OUTPUT}"
          echo "artifact_path=dist/${stem}.zip" >> "${GITHUB_OUTPUT}"

      - name: Upload static zip (workflow artifact)
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.pkg.outputs.artifact_name }}
          path: ${{ steps.pkg.outputs.artifact_path }}
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub Release
    needs: [prepare, build, build-web, build-linux-static]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download build zips
        uses: actions/download-artifact@v7
        with:
          path: release-assets
          pattern: "mog-*"
          merge-multiple: true

      - name: List assets
        run: |
          set -euo pipefail
          find release-assets -type f -name '*.zip' | tee assets.list
          test -s assets.list

      - name: Create GitHub Release
        if: needs.prepare.outputs.dry_run != 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: ${{ needs.prepare.outputs.tag }}
          generate_release_notes: true
          prerelease: ${{ needs.prepare.outputs.prerelease == 'true' }}
          files: release-assets/**/*.zip
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Dry-run summary
        if: needs.prepare.outputs.dry_run == 'true'
        run: |
          echo "Dry run complete for ${{ needs.prepare.outputs.tag }} — assets:"
          find release-assets -type f -name '*.zip' -print

plugins {
    id "com.android.application"
}

def testAbi = providers.gradleProperty("mogTestAbi").getOrElse("x86_64")

android {
    namespace "com.bluesentinelsec.mog.test"
    compileSdk 35
    ndkVersion "27.2.12479018"

    defaultConfig {
        applicationId "com.bluesentinelsec.mog.test"
        minSdk 21
        targetSdk 35
        versionCode 1
        versionName "1.0"

        ndk {
            abiFilters testAbi
        }

        externalNativeBuild {
            cmake {
                arguments "-DANDROID_STL=c++_shared"
                targets "mog_android_test"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        prefab true
    }

    packaging {
        jniLibs {
            // Prefab stages the imported AAR libraries beside the consumer's
            // JNI target; both copies originate from this exact AAR/NDK build.
            pickFirsts += ["**/libmog.so", "**/libc++_shared.so"]
        }
    }

    externalNativeBuild {
        cmake {
            path rootProject.projectDir.toPath().resolve("../tests/android/CMakeLists.txt").toFile()
            version "3.22.1"
        }
    }
}

dependencies {
    debugImplementation files("../mog/build/outputs/aar/mog-debug.aar")
    releaseImplementation files("../mog/build/outputs/aar/mog-release.aar")
}
